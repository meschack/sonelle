name: Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_name: ${{ steps.version.outputs.release_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fetch release tags
        run: git fetch --force --tags

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Resolve release version
        id: version
        run: node scripts/prepare-release-version.mjs

  build:
    name: Build ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.platform }}
    if: github.event.workflow_run.conclusion == 'success'

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - label: Linux x64
            platform: ubuntu-24.04
            args: ""
          - label: Windows x64
            platform: windows-latest
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fetch release tags
        run: git fetch --force --tags

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            gstreamer1.0-plugins-bad \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            xdg-utils \
            libfuse2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply resolved release version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: >-
          node --input-type=module --eval
          'import { patchReleaseVersion } from "./scripts/prepare-release-version.mjs";
          patchReleaseVersion(process.env.RELEASE_VERSION);'

      - name: Stage Windows voice runtime libraries
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/stage-windows-voice-runtime.ps1

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: ${{ needs.version.outputs.release_name }}
          releaseBody: |
            Automated Sonelle desktop release from ${{ github.event.workflow_run.head_sha }}.

            Assets include desktop bundles for Linux, macOS, and Windows, signed Android APKs for
            32-bit and 64-bit ARM phones, and an unsigned iOS signing handoff.
            macOS builds use ad-hoc signing until a Developer ID certificate is configured.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-mobile:
    name: Publish mobile release assets
    needs:
      - version
      - build
    runs-on: ubuntu-24.04

    steps:
      - name: Download mobile artifacts from the triggering CI run
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: sonelle-*
          merge-multiple: true
          path: artifacts/mobile

      - name: Verify mobile artifacts
        run: |
          test -f artifacts/mobile/sonelle-android-armeabi-v7a.apk
          test -f artifacts/mobile/sonelle-android-armeabi-v7a.json
          test -f artifacts/mobile/sonelle-android-armeabi-v7a.sha256
          test -f artifacts/mobile/sonelle-android-arm64-v8a.apk
          test -f artifacts/mobile/sonelle-android-arm64-v8a.json
          test -f artifacts/mobile/sonelle-android-arm64-v8a.sha256
          test -f artifacts/mobile/sonelle-ios-arm64-unsigned.ipa
          test -f artifacts/mobile/sonelle-ios-arm64-unsigned.sha256
          for abi in armeabi-v7a arm64-v8a; do
            expected=$(cut -d ' ' -f 1 "artifacts/mobile/sonelle-android-$abi.sha256")
            actual=$(sha256sum "artifacts/mobile/sonelle-android-$abi.apk" | cut -d ' ' -f 1)
            test "$actual" = "$expected"
          done
          expected=$(cut -d ' ' -f 1 artifacts/mobile/sonelle-ios-arm64-unsigned.sha256)
          actual=$(sha256sum artifacts/mobile/sonelle-ios-arm64-unsigned.ipa | cut -d ' ' -f 1)
          test "$actual" = "$expected"

      - name: Upload mobile release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/mobile/* --clobber
